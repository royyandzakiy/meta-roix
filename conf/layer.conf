BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-roix"
BBFILE_PATTERN_meta-roix = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-roix = "10"

LAYERDEPENDS_meta-roix = "core raspberrypi"
LAYERSERIES_COMPAT_meta-roix = "scarthgap"
